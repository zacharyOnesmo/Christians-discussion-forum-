{% extends 'dashboard/base.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-shell panel">
        <div class="auth-header">
            <span class="hero-badge">NenoLens</span>
            <h2>{{ ui.login_title }}</h2>
            <p>{{ ui.login_subtitle }}</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="primary-btn">{{ ui.login_cta }}</button>
        </form>

        <div class="auth-footer">
            <p>{{ ui.login_prompt }} <a href="{% url 'register' %}?lang={{ lang|default:'sw' }}">{{ ui.login_link }}</a></p>
        </div>
    </div>
</div>
{% endblock %}
